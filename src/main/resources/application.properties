spring.application.name=meditation

# User-facing service brand
app.brand.name=MSDS
app.brand.tagline=Meditate. Slow Down. Stay.

spring.datasource.dbcp2.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:7200000}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.jpa.hibernate.ddl-auto=update

# Quietness demo data is opt-in and disabled in normal environments.
app.quietness.demo.enabled=${QUIETNESS_DEMO_ENABLED:false}
app.quietness.demo.guesthouse-id=${QUIETNESS_DEMO_GUESTHOUSE_ID:1}

# Program demo data is opt-in and disabled in normal environments.
app.program.demo.enabled=${PROGRAM_DEMO_ENABLED:false}

# Inquiry admin/demo data is opt-in and disabled in normal environments.
app.inquiry.demo.enabled=${ADMIN_INQUIRY_DEMO_ENABLED:false}
app.inquiry.demo.admin-email=${ADMIN_INQUIRY_DEMO_EMAIL:admin@msds.com}
app.inquiry.demo.admin-password=${ADMIN_INQUIRY_DEMO_PASSWORD:Admin2026!}
